# Bottom Accumulation Reversal Strategy / 底部吸筹反转
# Detects stocks that have experienced significant decline and are now
# showing institutional accumulation signals (volume expansion, RSI recovery,
# MACD bottom structure, price stabilization).

name: bottom_accumulation
display_name: 底部吸筹反转
description: 深度回调后出现底部吸筹信号，捕捉机构资金介入的反转机会。bottom_accumulation_quality 因子主导评分，放宽传统横盘过滤器约束。
category: trend
core_rules: [1, 2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [底部吸筹, 底部反转, 吸筹反转]
default_priority: 45
market_regimes: [trending_down, sideways]

instructions: |
  **底部吸筹反转（Bottom Accumulation Reversal Strategy）**

  入场判定标准：

  1. **深度回调确认**（核心前提）：
     - 使用 `get_daily_history`（至少 60 个交易日）。
     - 60 日跌幅 ≥ 15%（建立底部空间），但不超过 60%（避免崩盘股）。
     - 最佳区间：60 日跌幅 15%~40%，属于健康回调。
     - `analyze_trend` → 趋势处于下跌或横盘阶段。

  2. **量能底部扩张**（机构吸筹核心信号）：
     - 使用 `get_realtime_quote` 和 `get_daily_history`。
     - 近 5 日成交量较 20 日均量放大 ≥ 30%（机构底部建仓信号）。
     - 连续 2~3 日温和放量加分。
     - 单日异常放量（量比 > 5.0）需谨慎，可能为诱多。

  3. **RSI 超卖恢复**（情绪反转信号）：
     - 近 20 日 RSI 曾低于 35（确认超卖区域）。
     - 当前 RSI 已从低点回升 ≥ 5 点。
     - RSI 恢复幅度越大，信号越强。

  4. **MACD 底部结构**（技术反转确认）：
     - MACD 在零轴下方金叉（底部环境 + 金叉信号）。
     - DIF/DEA 均在零轴以下，确认底部位置。
     - 底背离形态为最强信号。

  5. **价格企稳**（风险控制）：
     - 股价已从 60 日低点反弹 ≥ 3%，理想区间 3-8%（最接近底部吸筹区）。
     - 反弹超过 15% 得分递减，超过 20% 得分归零（已脱离底部）。
     - MA5 开始拐头向上（近 10 日 MA5 斜率改善）。
     - 避免追高：已从底部大幅反弹（>20%）的个股不再追入。

  6. **追高风险控制**（新增）：
     - 20 日涨幅 > 8%：开始扣分，15% 以上显著扣分（已上涨过多）。
     - 10 日涨幅 > 5%：额外追高风险惩罚（短线急涨）。
     - 底部筹码峰开始减少 + 股价已大幅反弹 = 主力出货风险。

  7. **K 线形态确认**（新增）：
     - 长上影线（>50%振幅）配合近期上涨 = 主力拉高出货信号。
     - 高位长上影叠加缩量或滞涨，减分强化风控。
     - 通过 `get_daily_history` 分析日 K 实体与影线比例。

  8. **风险确认**（关联理念5：风险排查）：
     - 通过 `search_stock_news` 排除利空消息。
     - 排除 ST 股票。
     - 追涨涨幅 > 6.0% 或换手率 > 15% 需警惕。
     - 底部放量但价格不涨"滞涨"需警惕。
     - 止损设在 60 日低点下方 3%。

  评分调整：
  - 底部吸筹 5 条件满足 ≥ 3 个：bottom_accumulation_quality 基础分 30+
  - 60 日跌幅在 15-40% 甜蜜区：+25 分（满分）
  - RSI 曾低于 35 且回升超过 10 点：+15 分
  - 底部 MACD 金叉：+15 分
  - 量能扩张 1.3x 以上：+8 分，2.0x 以上：+15 分
  - 靠近 60 日低点（反弹 ≤ 5%）：低吸优势，加分
  - 在 `buy_reason` 中注明"底部吸筹反转"。
