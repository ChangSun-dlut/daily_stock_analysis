  ranking_hints: '优先关注：

    1. 最近 5 日出现缩量横盘 / 缩量小阴小阳十字星后再次放量上行的标的

    2. 60 日内有过 4-12% 的中期回撤，并且价格守在 MA20 上方

    3. 当日实体占比较高（body_pct_min: 0.5），最好是阳线带量

    4. 关注板块主题热度，与 AI/消费/新能源/医药等热门主题的契合度可加权

    5. 切忌追高：当日涨幅 ≥ 7% 或 60 日累计已 ≥ 50% 的应降低权重

    6. 注意连续涨停/一字板的不可参与标的（hard_filters 已过滤出部分）

    '
  max_output: 6
