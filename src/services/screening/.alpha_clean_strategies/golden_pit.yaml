name: golden_pit
display_name: 黄金坑
description: 参考百花医药 & 一鸣食品的标准黄金坑模式：起涨试探 → 回落均线下缩量 → 坑底启动反弹。侧重 reversal 回撤锚定 + 横盘质量
  + 资金关注度，硬过滤仅 snapshot 级避免 daily NaN 误杀。
version: '1.0'
category: trend
tags:
- pullback
- breakout
- trend_continuation
- golden_pit
style:
  risk_profile: aggressive
  holding_period: short_term
  execution_style: pullback_buy
  market_regime:
  - trending_up
  - range_bound
  capital_profile: medium_liquidity
  ui_badge: 黄金坑
screening:
  enabled: true
  market_scope:
  - cn
  hard_filters:
    exclude_st: true
    price_min: 3
    price_max: 999
    amount_min: 50000000
    market_cap_min: 2000000000
    change_pct_min: -0.6
    change_pct_max: 4.8
    turnover_rate_min: 0.3
    require_ma_bullish: null
    require_price_above_ma20: null
    bottom_accumulation_bypass: null
    signal_score_min: null
    macd_status_whitelist: null
    rsi_status_whitelist: null
    change_60d_min: null
    change_60d_max: 35.0
    change_20d_min: null
    change_20d_max: null
    breakout_20d_pct_min: null
    breakout_20d_pct_max: null
    range_20d_pct_max: null
