  ranking_hints: '在满足老鸭头形态的候选中，优先关注：

    1. 鸭颈已形成且成熟：MA5/MA10 放量上穿 MA60 后 15-45 日，60 日均线走平或向上

    2. 鸭头回调充分缩量：回调期量能峰值/谷值 >= 2（量芝麻点），理想 >= 3，且未有效跌破 60 日线

    3. 鸭头顶远离 60 日线（>=8%），回撤 8-25%

    4. 鸭鼻孔贴合（MA5/MA10 间隙 <=0.5%），出现死叉后再金叉（鸭嘴）

    5. 鸭嘴放量突破前高（ramp_ratio 1.15-3.5）；无量突破属诱多，必须排除

    '
  max_output: 8
